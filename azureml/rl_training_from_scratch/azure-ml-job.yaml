$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
experiment_name: rl-training-from-scratch-validation
description: Executes tutorial/rl_training_from_scratch.ipynb end to end on one H100 and saves the executed notebook to outputs/.
command: bash run_job.sh ${{inputs.data}}
inputs:
  data:
    type: uri_folder
    path: azureml:calc-x@latest
    mode: download
code: .
environment:
  build:
    path: ../../calc_x/environment
resources:
  instance_count: 1
  shm_size: 64g
compute: azureml:h1002-pi
