[project]
name = "agl-rl-tutorials"
version = "0.1.0"
description = "Hands-on notebooks for RL training of LLM agents with verl and Agent Lightning, using the Calc-X example"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agentlightning==1.0.2",
    # Calc-X agent (examples/calc_x)
    "autogen-agentchat",
    "autogen-ext[openai]",
    "mcp>=1.11.0,<2",
    "mcp-server-calculator",
    "openai",
    "httpx",
    "sympy",
    # notebooks
    "azure-identity",  # rl_training_from_scratch §8.4: Entra ID auth for a hosted (Azure AI Foundry) LLM judge
    "ipykernel",
    "matplotlib",
    "pandas",
    "pyarrow",
    "nbclient",
    "nbformat",
    "ipywidgets>=8.1.9",  # so tqdm and Ray in the notebooks find it, instead of printing warnings
]

[tool.uv]
package = false
# autogen-core pins protobuf~=5.29, but vLLM's tracing (via OpenTelemetry) needs protobuf 6: without this,
# `from vllm import LLM` fails. The Calc-X agent runs fine on protobuf 6.
override-dependencies = ["protobuf>=6.33.5,<7"]
